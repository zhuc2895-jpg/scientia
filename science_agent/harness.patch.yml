# SCIENTIA research extension for the single-agent sdk-minimal profile.
# Enables first-class file tools and web evidence retrieval without adding
# subagents, teams, workflows, or a second agent identity.
- id: tool-fs
  config:
    read: true
    readImage: true
    write: true
    edit: true
    applyPatch: false
    readLimit: 4000
    readMaxBytes: 102400
- insert:
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-search-api
        fetchProvider: http
    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000
